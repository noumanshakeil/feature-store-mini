[project]
name = "feature-store-mini"
version = "2.0.0"
description = "Mini online feature store with entities, feature defs, values, and simple lineage notes."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
