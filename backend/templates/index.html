<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head>
<body><main>
<h1>{{ title }}</h1><p class="sub">Register entities/features, write values, read online map.</p>
<div class="grid">
<section class="card">
  <form method="post" action="/ui/entities"><label>Entity</label><input name="name" value="user"/><button type="submit">Ensure</button></form>
  <form method="post" action="/ui/defs"><label>Entity</label><input name="entity_name" value="user"/>
  <label>Feature</label><input name="name" value="login_count_7d"/>
  <label>Lineage</label><input name="lineage" value="events.login rolling 7d"/>
  <button type="submit">Register</button></form>
  <form method="post" action="/ui/values"><label>Entity</label><input name="entity_name" value="{{ entity_name }}"/>
  <label>Key</label><input name="entity_key" value="{{ entity_key }}"/>
  <label>Feature</label><input name="feature_name" value="login_count_7d"/>
  <label>Value</label><input name="value" type="number" step="0.01" value="3"/>
  <button type="submit">Set</button></form>
</section>
<section class="card">
  <h2>Online features</h2>
  <pre>{{ online }}</pre>
  <h3>Defs</h3>
  {% for f in defs %}<div class="sub">{{ f.entity_name }}.{{ f.name }} · {{ f.lineage }}</div>{% endfor %}
</section>
</div></main></body></html>
